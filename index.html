<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fastwheels - Sell Your Car</title>
  
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            brandRed: {
              50: '#fef2f2',
              100: '#fee2e2',
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone (Runs React directly in browser without build tools) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.08), 0 8px 10px -6px rgba(30, 58, 138, 0.04);
    }
  </style>
</head>
<body class="bg-white text-slate-800 antialiased min-h-screen flex flex-col">

  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // Available car models mapped by make with catalog images
    const CAR_DATA = {
      Porsche: {
        models: ["Taycan", "911 Carrera", "Panamera", "Cayenne", "Macan"],
        image: "images/taycan.webp"
      },
      Audi: {
        models: ["A4", "A6", "Q7", "e-tron GT", "R8"],
        image: "images/audi.webp"
      },
      Tesla: {
        models: ["Model 3", "Model Y", "Model S", "Model X", "Cybertruck"],
        image: "images/tesla.webp"
      },
      Bentley: {
        models: ["Continental GT", "Flying Spur", "Bentayga"],
        image: "images/bentley.webp"
      },
      Mazda: {
        models: ["Mazda 3", "Mazda 6", "CX-5", "CX-9", "MX-5 Miata"],
        image: "images/mazda.webp"
      },
      Peugeot: {
        models: ["208", "308", "2008", "3008", "5008"],
        image: "images/peugeot.webp"
      },
      Koenigsegg: {
        models: ["Jesko", "Gemera", "Regera", "Agera RS"],
        image: "images/konisegg.webp"
      },
      Toyota: {
        models: ["Corolla", "Camry", "Yaris", "Fortuner", "Land Cruiser", "Prado"],
        image: "images/taycan.webp"
      },
      Honda: {
        models: ["Civic", "City", "Accord", "CR-V", "BR-V"],
        image: "images/audi.webp"
      }
    };

    function App() {
      // 3 Connected Tabs: 'sell' (Tab 1), 'valuation' (Tab 2), 'confirmation' (Tab 3)
      const [activeTab, setActiveTab] = useState('sell');

      // Form Data State
      const [formData, setFormData] = useState({
        make: "Porsche",
        model: "Taycan",
        variant: "Performance Battery Plus",
        bodyType: "Sedan",
        year: "2023",
        mileage: "15,000 km",
        price: "45000000",
        isCertified: true,
        sellerName: "FAST Student",
        sellerPhone: "0300-1234567",
        sellerCity: "Islamabad"
      });

      // Handle input change
      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => {
          const updated = {
            ...prev,
            [name]: type === 'checkbox' ? checked : value
          };
          // Automatically update model if make changes
          if (name === 'make' && CAR_DATA[value]) {
            updated.model = CAR_DATA[value].models[0];
          }
          return updated;
        });
      };

      // Form submission -> routes automatically to Tab 2 (Instant Valuation)
      const handleFormSubmit = (e) => {
        e.preventDefault();
        setActiveTab('valuation');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Selected car image
      const selectedCarImage = CAR_DATA[formData.make]?.image || "images/taycan.webp";

      return (
        <div className="flex flex-col min-h-screen bg-white">
          
          {/* ================= 1. TOP NAVBAR ================= */}
          <header className="bg-white border-b-2 border-brandBlue-100 sticky top-0 z-50 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Logo & Brand Name */}
                <div 
                  className="flex items-center space-x-3 cursor-pointer" 
                  onClick={() => setActiveTab('sell')}>
                  <img 
                    src="images/logo.jpeg" 
                    alt="Fastwheels Logo" 
                    className="h-12 w-auto object-contain rounded-md border border-brandBlue-200 shadow-sm"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      const fallback = document.getElementById('brand-fallback-icon');
                      if (fallback) fallback.style.display = 'inline-block';
                    }}
                  />
                  <div id="brand-fallback-icon" className="hidden text-brandBlue-900 text-2xl font-bold">
                    <i className="fa-solid fa-car-side text-brandRed-600 mr-1"></i>
                  </div>
                  <div>
                    <span className="text-2xl font-extrabold tracking-tight text-brandBlue-900">
                      FAST<span className="text-brandRed-600">WHEELS</span>
                    </span>
                    <span className="block text-[10px] uppercase tracking-widest text-brandBlue-600 font-semibold">
                      Student Car Marketplace
                    </span>
                  </div>
                </div>

                {/* Navigation Links */}
                <nav className="hidden md:flex space-x-8 text-sm font-semibold">
                  <a 
                    href="#home" 
                    onClick={(e) => { e.preventDefault(); setActiveTab('sell'); }} 
                    className={`transition-colors ${activeTab === 'sell' ? 'text-brandRed-600 font-bold' : 'text-brandBlue-900 hover:text-brandRed-600'}`}>
                    Home
                  </a>
                  <a 
                    href="#pricing" 
                    onClick={(e) => { e.preventDefault(); setActiveTab('valuation'); }} 
                    className={`transition-colors ${activeTab === 'valuation' ? 'text-brandRed-600 font-bold' : 'text-slate-600 hover:text-brandRed-600'}`}>
                    Pricing
                  </a>
                  <a 
                    href="#navigation" 
                    onClick={(e) => { e.preventDefault(); setActiveTab('sell'); }} 
                    className="text-slate-600 hover:text-brandRed-600 transition-colors">
                    Navigation
                  </a>
                  <a 
                    href="#blog" 
                    onClick={(e) => { e.preventDefault(); }} 
                    className="text-slate-600 hover:text-brandRed-600 transition-colors">
                    Blog
                  </a>
                  <a 
                    href="#contact" 
                    onClick={(e) => { e.preventDefault(); setActiveTab('confirmation'); }} 
                    className={`transition-colors ${activeTab === 'confirmation' ? 'text-brandRed-600 font-bold' : 'text-slate-600 hover:text-brandRed-600'}`}>
                    Contact
                  </a>
                </nav>

                {/* Navbar Icons (Search, User, Cart) & Red Action Button */}
                <div className="flex items-center space-x-5">
                  {/* Search Icon */}
                  <button 
                    type="button"
                    title="Search Cars" 
                    className="text-brandBlue-800 hover:text-brandRed-600 transition-colors p-2 text-lg">
                    <i className="fa-solid fa-magnifying-glass"></i>
                  </button>

                  {/* User Account Icon */}
                  <button 
                    type="button"
                    title="User Profile" 
                    className="text-brandBlue-800 hover:text-brandRed-600 transition-colors p-2 text-lg">
                    <i className="fa-regular fa-circle-user"></i>
                  </button>

                  {/* Cart Icon with badge */}
                  <div className="relative">
                    <button 
                      type="button"
                      title="Shopping Cart" 
                      className="text-brandBlue-800 hover:text-brandRed-600 transition-colors p-2 text-lg">
                      <i className="fa-solid fa-cart-shopping"></i>
                    </button>
                    <span className="absolute top-1 -right-1 bg-brandRed-600 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">
                      1
                    </span>
                  </div>

                  {/* Quick Sell CTA Button */}
                  <button 
                    type="button"
                    onClick={() => { setActiveTab('sell'); document.getElementById('sell-form-section')?.scrollIntoView({ behavior: 'smooth' }); }}
                    className="hidden sm:inline-flex items-center space-x-2 bg-brandRed-600 hover:bg-brandRed-700 active:scale-95 text-white px-4 py-2 rounded-lg font-bold text-sm shadow hover:shadow-md transition-all">
                    <i className="fa-solid fa-plus text-xs"></i>
                    <span>Sell Car</span>
                  </button>
                </div>

              </div>
            </div>
          </header>

          {/* ================= 3 CONNECTED TABS NAVIGATION BAR ================= */}
          <div className="bg-brandBlue-50 border-b border-brandBlue-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-center sm:justify-start space-x-2 sm:space-x-8 overflow-x-auto py-3">
                
                {/* Tab 1 */}
                <button 
                  type="button"
                  onClick={() => setActiveTab('sell')}
                  className={`flex items-center space-x-2 px-4 py-2 text-sm rounded-lg font-bold transition-all ${
                    activeTab === 'sell'
                      ? 'bg-brandBlue-900 text-white shadow'
                      : 'text-brandBlue-900 hover:bg-white hover:text-brandRed-600'
                  }`}>
                  <span className="h-6 w-6 rounded-full bg-white/20 flex items-center justify-center text-xs">1</span>
                  <span>1. Sell Your Car</span>
                </button>

                {/* Tab 2 */}
                <button 
                  type="button"
                  onClick={() => setActiveTab('valuation')}
                  className={`flex items-center space-x-2 px-4 py-2 text-sm rounded-lg font-bold transition-all ${
                    activeTab === 'valuation'
                      ? 'bg-brandBlue-900 text-white shadow'
                      : 'text-brandBlue-900 hover:bg-white hover:text-brandRed-600'
                  }`}>
                  <span className="h-6 w-6 rounded-full bg-white/20 flex items-center justify-center text-xs">2</span>
                  <span>2. Instant Valuation</span>
                  <span className="bg-brandRed-600 text-white text-[10px] px-2 py-0.5 rounded-full font-normal">Active</span>
                </button>

                {/* Tab 3 */}
                <button 
                  type="button"
                  onClick={() => setActiveTab('confirmation')}
                  className={`flex items-center space-x-2 px-4 py-2 text-sm rounded-lg font-bold transition-all ${
                    activeTab === 'confirmation'
                      ? 'bg-brandBlue-900 text-white shadow'
                      : 'text-brandBlue-900 hover:bg-white hover:text-brandRed-600'
                  }`}>
                  <span className="h-6 w-6 rounded-full bg-white/20 flex items-center justify-center text-xs">3</span>
                  <span>3. Finalize & Listing</span>
                </button>

              </div>
            </div>
          </div>

          {/* ================= TAB 1: SELL YOUR CAR ================= */}
          {activeTab === 'sell' && (
            <main className="flex-grow">
              
              {/* Hero Banner Section */}
              <section className="relative bg-gradient-to-r from-brandBlue-900 via-blue-900 to-brandBlue-800 text-white py-14 px-4 sm:px-6 lg:px-8 border-b-4 border-brandRed-600 overflow-hidden">
                <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  
                  {/* Hero Left Content */}
                  <div className="lg:col-span-7 space-y-5">
                    <div className="inline-flex items-center space-x-2 bg-brandRed-600/30 border border-brandRed-500 text-red-100 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                      <i className="fa-solid fa-bolt text-brandRed-500"></i>
                      <span>Fast & Verified Car Selling</span>
                    </div>

                    <h1 className="text-4xl sm:text-5xl font-black tracking-tight leading-tight">
                      Start Selling <br className="hidden sm:inline" />
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-rose-200">Your Car</span>
                    </h1>

                    <p className="text-blue-100 text-base sm:text-lg max-w-xl">
                      Sell your automobile with FASTWHEELS. Fill out the vehicle specifications below to receive an <strong className="text-white">Instant Valuation</strong> and connect directly with verified buyers.
                    </p>

                    <div className="pt-2 flex flex-wrap gap-4">
                      {/* Red Button "Start Your Car" */}
                      <button 
                        type="button"
                        onClick={() => document.getElementById('sell-form-section')?.scrollIntoView({ behavior: 'smooth' })}
                        className="bg-brandRed-600 hover:bg-brandRed-700 active:scale-95 text-white font-bold text-base px-8 py-3.5 rounded-xl shadow-lg shadow-red-900/40 border-2 border-red-500 transition-all flex items-center space-x-3">
                        <i className="fa-solid fa-key"></i>
                        <span>Start Your Car</span>
                      </button>

                      <button 
                        type="button"
                        onClick={() => setActiveTab('valuation')}
                        className="bg-white/10 hover:bg-white/20 text-white font-semibold text-base px-6 py-3.5 rounded-xl border border-white/20 transition-all flex items-center space-x-2">
                        <i className="fa-solid fa-chart-line text-blue-300"></i>
                        <span>Preview Instant Valuation</span>
                      </button>
                    </div>

                    {/* Trust badges */}
                    <div className="pt-4 grid grid-cols-3 gap-4 border-t border-blue-800/80 text-blue-200 text-xs">
                      <div><i className="fa-solid fa-shield-halved text-brandRed-500 mr-1.5"></i>100% Free Listing</div>
                      <div><i className="fa-solid fa-certificate text-brandRed-500 mr-1.5"></i>FAST Certified</div>
                      <div><i className="fa-solid fa-handshake text-brandRed-500 mr-1.5"></i>Direct Dealings</div>
                    </div>
                  </div>

                  {/* Hero Right Visual: Selected Car */}
                  <div className="lg:col-span-5 relative">
                    <div className="bg-white/5 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-2xl">
                      <div className="relative h-64 sm:h-72 w-full overflow-hidden rounded-xl bg-slate-900/40 flex items-center justify-center">
                        <img 
                          src={selectedCarImage} 
                          alt="Featured Car Preview" 
                          className="object-contain h-full w-full hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute top-3 left-3 bg-brandBlue-900/90 text-white text-xs font-bold px-3 py-1 rounded-full border border-blue-400">
                          {formData.make} {formData.model}
                        </div>
                        <div className="absolute bottom-3 right-3 bg-brandRed-600 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow">
                          Est. PKR {Number(formData.price || 0).toLocaleString()}
                        </div>
                      </div>
                      <div className="mt-3 flex items-center justify-between text-xs text-blue-200 px-1">
                        <span><i className="fa-solid fa-calendar mr-1"></i>Year: {formData.year}</span>
                        <span><i className="fa-solid fa-gauge mr-1"></i>{formData.mileage}</span>
                        <span><i className="fa-solid fa-car-side mr-1"></i>{formData.bodyType}</span>
                      </div>
                    </div>
                  </div>

                </div>
              </section>

              {/* 2-Column Form Section */}
              <section id="sell-form-section" className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                
                {/* Section Header */}
                <div className="text-center mb-8">
                  <h2 className="text-3xl font-extrabold text-brandBlue-900 tracking-tight">
                    Vehicle Specifications & Details
                  </h2>
                  <p className="text-slate-600 text-sm mt-2">
                    Enter the car particulars below to calculate accurate market rates and submit to Instant Valuation.
                  </p>
                  <div className="w-16 h-1 bg-brandRed-600 mx-auto mt-3 rounded-full"></div>
                </div>

                {/* Form Card with Blue Borders and Clean White Background */}
                <div className="bg-white rounded-2xl border-2 border-brandBlue-200 custom-shadow p-6 sm:p-10">
                  <form onSubmit={handleFormSubmit} className="space-y-6">
                    
                    {/* 2-Column Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                      {/* 1. Make Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-industry mr-1.5 text-brandRed-600"></i> Make
                        </label>
                        <select 
                          name="make"
                          value={formData.make}
                          onChange={handleInputChange}
                          required
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          {Object.keys(CAR_DATA).map(m => (
                            <option key={m} value={m}>{m}</option>
                          ))}
                        </select>
                      </div>

                      {/* 2. Model Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-car mr-1.5 text-brandRed-600"></i> Model
                        </label>
                        <select 
                          name="model"
                          value={formData.model}
                          onChange={handleInputChange}
                          required
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          {(CAR_DATA[formData.make]?.models || ["Standard Model"]).map(mod => (
                            <option key={mod} value={mod}>{mod}</option>
                          ))}
                        </select>
                      </div>

                      {/* 3. Variant Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-layer-group mr-1.5 text-brandRed-600"></i> Variant
                        </label>
                        <select 
                          name="variant"
                          value={formData.variant}
                          onChange={handleInputChange}
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          <option value="Standard / Base Edition">Standard / Base Edition</option>
                          <option value="Performance Battery Plus">Performance Battery Plus</option>
                          <option value="Sport Edition (AWD)">Sport Edition (AWD)</option>
                          <option value="Hybrid Synergy Drive">Hybrid Synergy Drive</option>
                          <option value="Turbocharged V6">Turbocharged V6</option>
                          <option value="Luxury Trim Package">Luxury Trim Package</option>
                        </select>
                      </div>

                      {/* 4. Body Type Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-truck-pickup mr-1.5 text-brandRed-600"></i> Body Type
                        </label>
                        <select 
                          name="bodyType"
                          value={formData.bodyType}
                          onChange={handleInputChange}
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          <option value="Sedan">Sedan</option>
                          <option value="SUV">SUV (Sport Utility)</option>
                          <option value="Coupe">Coupe</option>
                          <option value="Hatchback">Hatchback</option>
                          <option value="Crossover">Crossover</option>
                          <option value="Supercar / Hypercar">Supercar / Hypercar</option>
                        </select>
                      </div>

                      {/* 5. Year Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-calendar-days mr-1.5 text-brandRed-600"></i> Year
                        </label>
                        <select 
                          name="year"
                          value={formData.year}
                          onChange={handleInputChange}
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          <option value="2025">2025 (Latest)</option>
                          <option value="2024">2024</option>
                          <option value="2023">2023</option>
                          <option value="2022">2022</option>
                          <option value="2021">2021</option>
                          <option value="2020">2020</option>
                          <option value="2019">2019</option>
                          <option value="2018">2018</option>
                          <option value="2017">2017</option>
                          <option value="2015">2015 & Older</option>
                        </select>
                      </div>

                      {/* 6. Mileage Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-tachometer-alt mr-1.5 text-brandRed-600"></i> Mileage
                        </label>
                        <select 
                          name="mileage"
                          value={formData.mileage}
                          onChange={handleInputChange}
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          <option value="0 - 5,000 km (Brand New)">0 - 5,000 km (Brand New)</option>
                          <option value="15,000 km">10,000 - 25,000 km</option>
                          <option value="35,000 km">25,000 - 50,000 km</option>
                          <option value="65,000 km">50,000 - 80,000 km</option>
                          <option value="100,000+ km">80,000 - 120,000+ km</option>
                        </select>
                      </div>

                      {/* 7. Price Dropdown */}
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-brandBlue-900 mb-2">
                          <i className="fa-solid fa-money-bill-wave mr-1.5 text-brandRed-600"></i> Expected Asking Price (PKR)
                        </label>
                        <select 
                          name="price"
                          value={formData.price}
                          onChange={handleInputChange}
                          className="w-full bg-white border-2 border-brandBlue-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandBlue-700 focus:ring-1 focus:ring-brandBlue-700 transition">
                          <option value="2500000">PKR 2,500,000 (25 Lakhs)</option>
                          <option value="4500000">PKR 4,500,000 (45 Lakhs)</option>
                          <option value="7500000">PKR 7,500,000 (75 Lakhs)</option>
                          <option value="12000000">PKR 12,000,000 (1.2 Crore)</option>
                          <option value="25000000">PKR 25,000,000 (2.5 Crore)</option>
                          <option value="45000000">PKR 45,000,000 (4.5 Crore)</option>
                          <option value="85000000">PKR 85,000,000 (8.5 Crore)</option>
                        </select>
                      </div>

                      {/* 8. "Certified" Checkbox */}
                      <div className="flex items-center">
                        <label className="relative flex items-center p-4 bg-brandBlue-50/70 border-2 border-brandBlue-200 rounded-xl cursor-pointer hover:border-brandBlue-500 w-full transition">
                          <input 
                            type="checkbox"
                            name="isCertified"
                            checked={formData.isCertified}
                            onChange={handleInputChange}
                            className="h-5 w-5 rounded border-brandBlue-300 text-brandRed-600 focus:ring-brandRed-500 cursor-pointer"
                          />
                          <div className="ml-3">
                            <span className="text-sm font-bold text-brandBlue-900 block">
                              FAST Certified Inspection
                            </span>
